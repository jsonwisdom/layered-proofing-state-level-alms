name: Validate Receipts

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm install -g ajv-cli

      - name: Validate REC-*.json against schema
        run: |
          ajv validate -s schemas/receipt.v1.schema.json -d "receipts/REC-*.json" --strict
